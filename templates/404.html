{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | RAIL-SAHAYAK</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --primary-hover: #1e293b;
            --bg-color: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow-x: hidden;
        }

        /* Minimal Navbar */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0.85rem 1.5rem;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--primary-blue);
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }

        .navbar-brand i {
            font-size: 1.4rem;
        }

        /* Centered Error Container */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            max-width: 480px;
            width: 100%;
            padding: 2.25rem 2rem 2.5rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Railway Train Track Animation */
        .train-animation-wrapper {
            width: 100%;
            position: relative;
            margin-bottom: 1.25rem;
            overflow: hidden;
            height: 42px;
        }

        .rail-track {
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #cbd5e1;
        }

        .rail-track::after {
            content: '';
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                #94a3b8 0,
                #94a3b8 3px,
                transparent 3px,
                transparent 10px
            );
        }

        .moving-train {
            position: absolute;
            bottom: 6px;
            left: -120px;
            display: flex;
            align-items: flex-end;
            animation: moveTrain 8s linear infinite;
        }

        .train-icon {
            font-size: 1.8rem;
            color: var(--primary-blue);
            line-height: 1;
        }

        @keyframes moveTrain {
            0% {
                left: -80px;
            }
            100% {
                left: calc(100% + 40px);
            }
        }

        /* Typography & Controls */
        .error-code {
            font-size: 3.8rem;
            font-weight: 800;
            color: var(--primary-blue);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }

        .error-desc {
            font-size: 0.925rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .btn-group-custom {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn-primary-custom {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
        }

        .btn-outline-custom {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid #cbd5e1;
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-outline-custom:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        @media (max-width: 480px) {
            .btn-group-custom {
                flex-direction: column;
            }
            .btn-group-custom a {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Minimal Navbar -->
    <nav class="navbar">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="fa-solid fa-train text-primary"></i>
                <span>RAIL-SAHAYAK</span>
            </span>
        </div>
    </nav>

    <!-- Content -->
    <div class="main-container">
        <div class="error-card">
            
            <!-- Train Track Animation -->
            <div class="train-animation-wrapper">
                <div class="moving-train">
                    <i class="fa-solid fa-train-subway train-icon"></i>
                </div>
                <div class="rail-track"></div>
            </div>

            <div class="error-code">404</div>
            <h1 class="error-title">Page or Section Restricted</h1>
            <p class="error-desc">
                The page you are looking for does not exist or requires authorized login credentials to access.
            </p>

            <div class="btn-group-custom">
                <a href="{% url 'login' %}" class="btn-primary-custom">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Log In
                </a>
                <a href="{% url 'signup' %}" class="btn-outline-custom">
                    Register
                </a>
            </div>
        </div>
    </div>

</body>
</html>
