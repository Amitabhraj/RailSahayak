{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration | Rail-Sync AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Rail CSS -->
    <link rel="stylesheet" href="{% static 'css/rail_style.css' %}">
</head>
<body class="signup-page">

<div class="signup-card">
    <!-- Top Header Banner -->
    <div class="p-4 text-center border-bottom bg-white">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle text-white mb-2" style="width: 56px; height: 56px; background-color: #213d77;">
            <i class="fa-solid fa-id-card fs-3"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Railway Officer Registration</h4>
        <p class="text-muted small mb-0">Create verified credentials for Rail-Sync AI BDMS Portal</p>
    </div>

    <div class="p-4 bg-white">
        {% if error_message %}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3 small" role="alert">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>{{ error_message }}</div>
        </div>
        {% endif %}

        <!-- Signup Form -->
        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">First Name</label>
                    <input type="text" name="first_name" class="form-control form-control-sm form-control-rail" placeholder="e.g. Ramesh" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Last Name</label>
                    <input type="text" name="last_name" class="form-control form-control-sm form-control-rail" placeholder="e.g. Sharma" required>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Username</label>
                    <input type="text" name="username" class="form-control form-control-sm form-control-rail font-monospace" placeholder="e.g. ramesh_tms" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Official Email</label>
                    <input type="email" name="email" class="form-control form-control-sm form-control-rail" placeholder="officer@railnet.gov.in" required>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Department / Discipline</label>
                    <select name="department" class="form-select form-select-sm form-select-rail" required>
                        <option value="TMS" selected>TMS: Civil Engineering (Track / P-Way)</option>
                        <option value="SMMS">SMMS: Signalling & Telecom (S&T)</option>
                        <option value="TDMS">TDMS: Electrical (Traction / OHE)</option>
                        <option value="COA">COA: Control Office / Operating</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Designation</label>
                    <input type="text" name="designation" class="form-control form-control-sm form-control-rail" placeholder="e.g. SSE (P-Way) or DSTE" required>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Employee ID / PF No.</label>
                    <input type="text" name="employee_id" class="form-control form-control-sm form-control-rail font-monospace" placeholder="e.g. IR-2026-9041">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Division</label>
                    <select name="division_id" class="form-select form-select-sm form-select-rail">
                        {% for d in divisions %}
                        <option value="{{ d.id }}">{{ d.code }} - {{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control form-control-sm form-control-rail" placeholder="At least 5 characters" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-dark small fw-bold">Confirm Password</label>
                    <input type="password" name="password_confirm" class="form-control form-control-sm form-control-rail" placeholder="Repeat password" required>
                </div>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="complianceCheck" required checked>
                <label class="form-check-label text-muted small" for="complianceCheck">
                    I confirm that maintenance blocks demanded will comply with Indian Railways General & Subsidiary Rules (G&SR) and OHE power isolation protocols.
                </label>
            </div>

            <button type="submit" class="btn btn-rail-primary w-100 py-2 mb-3">
                <i class="fa-solid fa-user-plus me-1"></i> Register & Enter Operations Center
            </button>
        </form>

        <div class="text-center text-muted small">
            Already have verified credentials?
            <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none ms-1">Sign In Here</a>
        </div>
    </div>
</div>

</body>
</html>
